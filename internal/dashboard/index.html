<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transcode Monitor</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#111723;--line:#263044;--text:#f4f7fb;--muted:#8d9ab0;--cyan:#4dd8ff;--blue:#6d7cff;--green:#38d996;--amber:#ffbd59;--red:#ff6b75}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#172847 0,transparent 36%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}main{width:min(1380px,calc(100% - 36px));margin:auto;padding:28px 0 48px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{display:grid;place-items:center;width:42px;height:42px;border:1px solid #315178;border-radius:13px;background:linear-gradient(145deg,#17243a,#0f1520);font-size:20px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.title{font-size:23px;font-weight:750;letter-spacing:-.03em}.connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px currentColor}.connection.live .dot{background:var(--green)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}.card{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(22,30,44,.96),rgba(14,20,31,.96));border-radius:14px;padding:16px}.metric-head{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.metric-value{margin:8px 0 7px;font-size:26px;font-weight:760;letter-spacing:-.04em}.metric-sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter{height:5px;background:#273043;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:inherit;transition:width .5s ease}.io{display:flex;gap:16px}.io b{color:var(--text);font-size:13px}.up{color:var(--amber)}.down{color:var(--cyan)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:0 2px 11px}.section-head h2{font-size:15px;margin:0}.section-head span{color:var(--muted);font-size:12px}.jobs{display:grid;gap:12px}.job{border:1px solid var(--line);border-radius:15px;background:rgba(15,21,32,.93);overflow:hidden}.job-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}.job-name{font-size:16px;font-weight:700}.job-meta{color:var(--muted);font-size:11px;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}.overall{text-align:right;min-width:150px}.overall strong{font-size:20px}.overall .meter{margin-top:6px;height:7px}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;padding:9px 18px 14px}.step{display:grid;grid-template-columns:150px minmax(80px,1fr) 48px;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid rgba(38,48,68,.65)}.step:nth-last-child(-n+2){border-bottom:0}.step-name{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap}.state{width:6px;height:6px;border-radius:50%;background:#536078}.step.processing .state{background:var(--cyan);box-shadow:0 0 9px var(--cyan)}.step.completed .state{background:var(--green)}.step.failed .state{background:var(--red)}.step .meter i{background:linear-gradient(90deg,#5f6fff,#4dd8ff)}.step.completed .meter i{background:var(--green)}.pct{text-align:right;color:#c8d1df;font-variant-numeric:tabular-nums;font-size:12px}.empty{display:grid;place-items:center;min-height:220px;border:1px dashed #2c374b;border-radius:15px;color:var(--muted);text-align:center}.empty strong{display:block;color:#cad3df;font-size:15px;margin-bottom:5px}.gpu-name{max-width:180px}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.step:nth-last-child(-n+2){border-bottom:1px solid rgba(38,48,68,.65)}.step:last-child{border-bottom:0}}@media(max-width:560px){main{width:min(100% - 22px,1380px);padding-top:18px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.metric-value{font-size:21px}.job-head{grid-template-columns:1fr}.overall{text-align:left}.step{grid-template-columns:125px 1fr 42px}.top{align-items:flex-start}.connection span:last-child{display:none}}
  </style>
</head><body><main>
  <header class="top"><div class="brand"><div class="logo">◫</div><div><div class="eyebrow">Realtime worker</div><div class="title">Transcode Monitor</div></div></div><div id="connection" class="connection"><i class="dot"></i><span>Connecting</span></div></header>
  <section class="metrics"><article class="card"><div class="metric-head"><span>GPU</span><span id="gpuTemp">—</span></div><div class="metric-value" id="gpuValue">—</div><div class="meter"><i id="gpuMeter"></i></div><div class="metric-sub gpu-name" id="gpuName">Waiting for NVIDIA</div></article><article class="card"><div class="metric-head"><span>NVENC</span><span id="gpuMemory">—</span></div><div class="metric-value" id="encoderValue">—</div><div class="meter"><i id="encoderMeter"></i></div><div class="metric-sub" id="gpuDecode">Decoder —</div></article><article class="card"><div class="metric-head"><span>CPU</span><span id="cpuCores">—</span></div><div class="metric-value" id="cpuValue">—</div><div class="meter"><i id="cpuMeter"></i></div><div class="metric-sub" id="memory">Memory —</div></article><article class="card"><div class="metric-head"><span>DISK I/O</span><span id="diskUsed">—</span></div><div class="metric-value io"><span class="down">↓ <b id="diskRead">—</b></span><span class="up">↑ <b id="diskWrite">—</b></span></div><div class="meter"><i id="diskMeter"></i></div><div class="metric-sub">Read / Write per second</div></article></section>
  <div class="section-head"><h2>Active jobs</h2><span id="updated">Waiting for data…</span></div><section id="jobs" class="jobs"><div class="empty"><div><strong>No active transcodes</strong>Waiting for a worker to claim a job</div></div></section>
</main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pct=v=>Math.max(0,Math.min(100,Number(v)||0)),percent=v=>`${pct(v).toFixed(Number(v)%1?1:0)}%`;function bytes(v){v=Number(v)||0;const u=['B','KB','MB','GB','TB'];let i=0;while(v>=1024&&i<u.length-1){v/=1024;i++}return`${v.toFixed(i<2?0:1)} ${u[i]}`}const speed=v=>`${bytes(v)}/s`,meter=(id,v)=>$(id).style.width=`${pct(v)}%`;
function renderSystem(s={}){const g=(s.gpus||[])[0];if(g){$('gpuValue').textContent=percent(g.gpuPercent);$('gpuName').textContent=g.name;$('gpuTemp').textContent=`${g.temperature||0}°C · ${Number(g.powerWatts||0).toFixed(0)}W`;meter('gpuMeter',g.gpuPercent);$('encoderValue').textContent=percent(g.encoderPercent);meter('encoderMeter',g.encoderPercent);$('gpuMemory').textContent=`${bytes(g.memoryUsed)} / ${bytes(g.memoryTotal)}`;$('gpuDecode').textContent=`Decoder ${percent(g.decoderPercent)}`}else{$('gpuValue').textContent='N/A';$('gpuName').textContent=s.gpuError||'NVIDIA GPU not found';$('encoderValue').textContent='N/A'}const c=s.cpu||{};$('cpuValue').textContent=percent(c.percent);$('cpuCores').textContent=`${c.cores||0} threads`;meter('cpuMeter',c.percent);const m=s.memory||{};$('memory').textContent=`Memory ${bytes(m.used)} / ${bytes(m.total)} (${percent(m.percent)})`;const d=s.disk||{};$('diskRead').textContent=speed(d.readBytesPerSecond);$('diskWrite').textContent=speed(d.writeBytesPerSecond);$('diskUsed').textContent=`${bytes(d.used)} / ${bytes(d.total)}`;meter('diskMeter',d.percent)}
function renderJobs(j=[]){if(!j.length){$('jobs').innerHTML='<div class="empty"><div><strong>No active transcodes</strong>Waiting for a worker to claim a job</div></div>';return}$('jobs').innerHTML=j.map(x=>`<article class="job"><header class="job-head"><div><div class="job-name">${esc(x.slug||x.fileId||x.id)}</div><div class="job-meta"><span>${esc(x.workerId)}</span><span>Job ${esc(x.id)}</span>${x.fileId?`<span>File ${esc(x.fileId)}</span>`:''}</div></div><div class="overall"><strong>${percent(x.overallPercent)}</strong><div class="meter"><i style="width:${pct(x.overallPercent)}%"></i></div></div></header><div class="steps">${(x.steps||[]).map(s=>`<div class="step ${esc(s.status)}"><div class="step-name"><i class="state"></i>${esc(s.label)}</div><div class="meter"><i style="width:${pct(s.percent)}%"></i></div><div class="pct">${percent(s.percent)}</div></div>`).join('')}</div></article>`).join('')}
const connection=$('connection'),source=new EventSource('/events');source.onopen=()=>{connection.classList.add('live');connection.lastElementChild.textContent='Live'};source.onerror=()=>{connection.classList.remove('live');connection.lastElementChild.textContent='Reconnecting'};source.onmessage=e=>{try{const d=JSON.parse(e.data);renderSystem(d.system);renderJobs(d.jobs);$('updated').textContent=`${d.jobs.length} running · updated ${new Date(d.timestamp).toLocaleTimeString()}`}catch(_){}};
</script></body></html>
